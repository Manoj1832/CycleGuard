name: cycleguard_app
description: "CycleGuard — Smart Bicycle Security App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Authentication
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # Networking
  http: ^1.3.0
  web_socket_channel: ^3.0.0

  # State Management
  provider: ^6.1.0

  # UI
  google_fonts: ^6.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
